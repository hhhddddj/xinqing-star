<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#060608">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>心情星云</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #060608; color: #e0e0e0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow: hidden;
  }
  .app {
    height: 100vh;
    display: flex; flex-direction: column;
    padding: max(env(safe-area-inset-top), 12px) 14px max(env(safe-area-inset-bottom), 14px);
    max-width: 560px; margin: 0 auto;
    gap: 10px;
  }
  .header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 4px;
  }
  .title {
    font-size: 1.1rem; font-weight: 600; letter-spacing: 2px;
    color: #e8c766;
  }
  .header-actions { display: flex; gap: 6px; }
  .icon-btn {
    background: none; border: none; color: #777;
    font-size: 18px; cursor: pointer; padding: 4px 8px;
    line-height: 1;
  }
  .icon-btn:active { color: #e8c766; }

  .mood-tabs {
    display: flex; gap: 6px; overflow-x: auto;
    padding: 0 2px 2px;
    scrollbar-width: none;
  }
  .mood-tabs::-webkit-scrollbar { display: none; }
  .mood-btn {
    flex-shrink: 0;
    padding: 6px 12px;
    border-radius: 8px;
    background: #151515;
    border: 1px solid #262626;
    color: #888;
    font-size: 13px;
    cursor: pointer;
    transition: all .15s;
    display: flex; align-items: center; gap: 4px;
  }
  .mood-btn.active {
    background: #2a2418;
    border-color: #e8c766;
    color: #e8c766;
  }

  .canvas-wrap {
    flex: 1;
    position: relative;
    border-radius: 14px;
    overflow: hidden;
    background: #060608;
    min-height: 280px;
  }
  #starMap {
    width: 100%; height: 100%;
    display: block;
    touch-action: none;
    cursor: grab;
  }
  #starMap:active { cursor: grabbing; }

  .canvas-hint {
    position: absolute;
    bottom: 8px; left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    color: rgba(255,255,255,0.22);
    pointer-events: none;
    white-space: nowrap;
    letter-spacing: 0.5px;
  }
  .zoom-controls {
    position: absolute;
    right: 10px; top: 10px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .zoom-btn {
    width: 30px; height: 30px;
    border-radius: 8px;
    background: rgba(15,15,15,0.7);
    border: 1px solid rgba(255,255,255,0.1);
    color: #bbb;
    font-size: 15px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    padding: 0;
  }
  .zoom-btn:active { background: rgba(232,199,102,0.25); }

  /* ===== 记录详情浮层 ===== */
  .record-card {
    position: absolute;
    left: 12px; right: 12px; bottom: 12px;
    background: rgba(20, 20, 26, 0.92);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 14px;
    padding: 14px 16px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 12px 36px rgba(0,0,0,0.6);
    transform: translateY(120%);
    opacity: 0;
    transition: transform .28s cubic-bezier(0.22, 1, 0.36, 1), opacity .2s;
    pointer-events: none;
    z-index: 5;
  }
  .record-card.show {
    transform: translateY(0);
    opacity: 1;
    pointer-events: auto;
  }
  .record-card-header {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 8px;
  }
  .record-card-emoji {
    font-size: 26px; line-height: 1;
  }
  .record-card-meta { flex: 1; min-width: 0; }
  .record-card-mood {
    font-size: 15px; font-weight: 600;
    margin-bottom: 2px;
  }
  .record-card-date {
    font-size: 11px; color: #777;
  }
  .record-card-close {
    background: none; border: none; color: #777;
    font-size: 18px; cursor: pointer; padding: 4px;
    line-height: 1;
    flex-shrink: 0;
  }
  .record-card-close:active { color: #fff; }
  .record-card-note {
    font-size: 14px; line-height: 1.5;
    color: #d0d0d0;
    word-break: break-word;
    white-space: pre-wrap;
    max-height: 120px;
    overflow-y: auto;
  }
  .record-card-note.empty-note {
    color: #555;
    font-style: italic;
  }

  .input-bar {
    background: #121212;
    border: 1px solid #242424;
    border-radius: 12px;
    padding: 8px 10px 8px 12px;
    display: flex; align-items: center; gap: 8px;
  }
  .input-bar .mood-preview {
    font-size: 20px;
    width: 28px; text-align: center;
    flex-shrink: 0;
  }
  .input-bar textarea {
    flex: 1;
    background: transparent;
    border: none;
    color: #e0e0e0;
    font-size: 15px;
    resize: none;
    font-family: inherit;
    outline: none;
    line-height: 1.4;
    max-height: 72px;
    min-height: 22px;
    padding: 4px 0;
  }
  .input-bar textarea::placeholder { color: #555; }
  .send-btn {
    background: #e8c766;
    border: none;
    border-radius: 8px;
    color: #111;
    padding: 7px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    flex-shrink: 0;
  }
  .send-btn:active { opacity: .8; }

  .footer {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 12px; color: #666;
    padding: 0 4px;
  }
  .footer input[type="date"] {
    background: #121212;
    border: 1px solid #242424;
    border-radius: 6px;
    color: #aaa;
    padding: 4px 8px;
    font-size: 12px;
    outline: none;
    color-scheme: dark;
  }
  .timeline-toggle {
    background: none; border: none; color: #888;
    font-size: 12px; cursor: pointer;
    padding: 4px 0;
  }

  .timeline-drawer {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: #0f0f0f;
    border-top: 1px solid #2a2a2a;
    border-radius: 16px 16px 0 0;
    padding: 14px 14px max(env(safe-area-inset-bottom), 14px);
    max-height: 55vh;
    overflow-y: auto;
    transform: translateY(105%);
    transition: transform .28s cubic-bezier(0.22, 1, 0.36, 1);
    z-index: 100;
  }
  .timeline-drawer.open { transform: translateY(0); }
  .timeline-drawer-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 10px;
  }
  .timeline-drawer-header h3 { margin: 0; font-size: 14px; color: #ccc; font-weight: 500; }
  .close-btn { background: none; border: none; color: #777; font-size: 18px; cursor: pointer; padding: 4px; }
  .timeline-item {
    background: #1a1a1a; border-radius: 10px; padding: 10px;
    margin-bottom: 8px; border-left: 3px solid #a78bfa;
    position: relative;
  }
  .timeline-item .date { font-size: 11px; color: #666; margin-bottom: 3px; }
  .timeline-item .content { display: flex; gap: 8px; align-items: flex-start; }
  .timeline-item .emoji { font-size: 18px; line-height: 1; }
  .timeline-item .text { flex: 1; font-size: 13px; line-height: 1.4; word-break: break-word; }
  .timeline-item .mood-name { font-weight: 600; margin-bottom: 2px; font-size: 12px; }
  .delete-btn {
    position: absolute; top: 5px; right: 5px;
    background: none; border: none; color: #555;
    font-size: 13px; cursor: pointer; padding: 4px;
    line-height: 1;
  }
  .delete-btn:active { color: #ff6b6b; }
  .empty { text-align: center; color: #555; padding: 20px; font-size: 13px; }
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <div class="title">心情星云</div>
    <div class="header-actions">
      <button class="icon-btn" id="resetView" title="复位视角">⟳</button>
      <button class="icon-btn" id="toggleTimeline" title="时光轴">☰</button>
    </div>
  </div>

  <div class="mood-tabs" id="moodPicker"></div>

  <div class="canvas-wrap">
    <canvas id="starMap"></canvas>
    <div class="canvas-hint">点星查看 · 拖动旋转 · 双指缩放</div>
    <div class="zoom-controls">
      <button class="zoom-btn" id="zoomIn">＋</button>
      <button class="zoom-btn" id="zoomOut">−</button>
    </div>

    <div class="record-card" id="recordCard">
      <div class="record-card-header">
        <div class="record-card-emoji" id="rcEmoji">😊</div>
        <div class="record-card-meta">
          <div class="record-card-mood" id="rcMood">开心</div>
          <div class="record-card-date" id="rcDate">2025-01-01</div>
        </div>
        <button class="record-card-close" id="rcClose">✕</button>
      </div>
      <div class="record-card-note" id="rcNote"></div>
    </div>
  </div>

  <div class="input-bar">
    <div class="mood-preview" id="moodPreview">☁️</div>
    <textarea id="note" placeholder="虚空里捞得一句话…" rows="1"></textarea>
    <button class="send-btn" id="saveBtn">记录</button>
  </div>

  <div class="footer">
    <input type="date" id="date">
    <span id="countLabel" style="color:#555;">还没有记录</span>
  </div>
</div>

<div class="timeline-drawer" id="timelineDrawer">
  <div class="timeline-drawer-header">
    <h3>时光轴</h3>
    <button class="close-btn" id="closeTimeline">✕</button>
  </div>
  <div id="timelineList"></div>
</div>

<script>
/* =========================================================
   工具
   ========================================================= */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* =========================================================
   心情配置
   ========================================================= */
const MOODS = [
  { mood: '开心', emoji: '😊', color: '#FFD93D' },
  { mood: '平静', emoji: '😌', color: '#6BCB77' },
  { mood: '难过', emoji: '😢', color: '#4D96FF' },
  { mood: '生气', emoji: '😠', color: '#FF6B6B' },
  { mood: '焦虑', emoji: '😰', color: '#B06BFF' },
  { mood: '疲惫', emoji: '😴', color: '#9AA5B1' }
];

let records = JSON.parse(localStorage.getItem('moodRecords') || '[]');
let selectedMood = MOODS[0];

// 严格递增的 id 计数器：从已有记录的最大 id 起步，
// 避免 Date.now() + 随机数在同一毫秒内撞车导致两颗星重叠 / 误删。
let idCounter = records.reduce((m, r) => Math.max(m, r.id || 0), 0);

/* =========================================================
   星云粒子系统
   ========================================================= */
const PARTICLE_COUNT = 3600;

function colorAt(t) {
  const stops = [
    [0.00, 255, 255, 255],
    [0.10, 235, 245, 255],
    [0.22, 180, 240, 245],
    [0.36, 110, 230, 180],
    [0.52, 130, 200, 150],
    [0.68, 230, 150, 170],
    [0.84, 200, 130, 230],
    [1.00, 130, 90, 200]
  ];
  for (let i = 0; i < stops.length - 1; i++) {
    const a = stops[i], b = stops[i + 1];
    if (t >= a[0] && t <= b[0]) {
      const k = (t - a[0]) / (b[0] - a[0]);
      return [
        Math.round(a[1] + (b[1] - a[1]) * k),
        Math.round(a[2] + (b[2] - a[2]) * k),
        Math.round(a[3] + (b[3] - a[3]) * k)
      ];
    }
  }
  return [255, 255, 255];
}

const particles = new Array(PARTICLE_COUNT);

(function initParticles() {
  const rand = mulberry32(88888);
  for (let i = 0; i < PARTICLE_COUNT; i++) {
    const rf = Math.pow(rand(), 2.6);
    const ringMod = 1 + 0.06 * Math.sin(rf * 22);
    const radius = rf * 720 * ringMod;
    const angle = rand() * Math.PI * 2;

    const px = Math.cos(angle) * radius;
    const pz = Math.sin(angle) * radius;
    const thickness = 12 + (1 - rf) * 40;
    const py = (rand() - 0.5) * thickness;

    const [r, g, b] = colorAt(rf);
    const size = 0.28 + rand() * 0.55 * (1 - rf * 0.3);
    const alpha = 0.25 + rand() * 0.55 * (1 - rf * 0.5);

    particles[i] = {
      x: px, y: py, z: pz,
      r, g, b, size, alpha,
      phase: rand() * Math.PI * 2,
      speed: 0.5 + rand() * 1.6
    };
  }
})();

/* =========================================================
   预计算太阳光线参数
   ========================================================= */
const RAYS = (function () {
  const rand = mulberry32(20250501);
  const list = [];
  const COUNT = 56;
  for (let i = 0; i < COUNT; i++) {
    list.push({
      angleOffset: (i / COUNT) * Math.PI * 2,
      lenFactor: 0.25 + rand() * 0.75,
      phase: rand() * Math.PI * 2,
      speed: 0.6 + rand() * 1.2,
      swayAmp: 0.01 + rand() * 0.025,
      swaySpeed: 0.3 + rand() * 0.5
    });
  }
  return list;
})();

/* =========================================================
   画布
   ========================================================= */
const canvas = document.getElementById('starMap');
const ctx = canvas.getContext('2d', { alpha: false });
let W = 0, H = 0, DPR = 1;

const view = {
  zoom: 1,
  panX: 0, panY: 0,
  tiltX: 1.02,
  rotY: 0,
  autoRotate: true,
  focal: 700
};

let inertiaY = 0;
let inertiaX = 0;

function resizeCanvas() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const rect = canvas.getBoundingClientRect();
  if (rect.width === 0 || rect.height === 0) return false;
  W = rect.width; H = rect.height;
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  return true;
}

function resetView() {
  view.zoom = 1;
  view.panX = 0;
  view.panY = 0;
  view.tiltX = 1.02;
  view.rotY = 0;
  inertiaY = 0;
  inertiaX = 0;
  view.autoRotate = true;
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#060608';
  ctx.fillRect(0, 0, W, H);
}

function moodStarPos(record) {
  const rand = mulberry32(record.id);
  const angle = rand() * Math.PI * 2;
  const radius = 90 + Math.pow(rand(), 0.8) * 170;
  return {
    x: Math.cos(angle) * radius,
    y: (rand() - 0.5) * 14,
    z: Math.sin(angle) * radius
  };
}

/* =========================================================
   把心情星投影到屏幕坐标（点击检测和渲染共用）
   ========================================================= */
function projectMoodStar(record, cosX, sinX, cosY, sinY, cx, cy, focal, zoom) {
  const p = moodStarPos(record);
  const x1 = p.x * cosY - p.z * sinY;
  const z1 = p.x * sinY + p.z * cosY;
  const y1 = p.y * cosX - z1 * sinX;
  const z2 = p.y * sinX + z1 * cosX;

  const zCam = z2 + focal;
  if (zCam < 30) return null;
  const k = focal / zCam;

  return {
    sx: x1 * k * zoom + cx,
    sy: y1 * k * zoom + cy,
    k
  };
}

// 用当前 view 参数投影（供点击检测使用）
function projectMoodStarNow(record) {
  const cosX = Math.cos(view.tiltX), sinX = Math.sin(view.tiltX);
  const cosY = Math.cos(view.rotY), sinY = Math.sin(view.rotY);
  const cx = W / 2 + view.panX;
  const cy = H / 2 + view.panY;
  return projectMoodStar(record, cosX, sinX, cosY, sinY, cx, cy, view.focal, view.zoom);
}

/* =========================================================
   渲染
   ========================================================= */
let lastT = 0;
let selectedRecordId = null; // 当前选中的记录 id（用于高亮）

function draw(t) {
  if (!W || !H) return;
  const time = t / 1000;
  const dt = lastT ? Math.min((t - lastT) / 1000, 0.05) : 0.016;
  lastT = t;

  if (view.autoRotate) view.rotY += dt * 0.10;

  if (Math.abs(inertiaY) > 0.00005) {
    view.rotY += inertiaY;
    inertiaY *= 0.94;
  } else inertiaY = 0;

  if (Math.abs(inertiaX) > 0.00005) {
    view.tiltX = Math.max(0.15, Math.min(1.5, view.tiltX + inertiaX));
    inertiaX *= 0.94;
  } else inertiaX = 0;

  // 背景：半透明覆盖形成残影
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.fillStyle = 'rgba(6, 6, 8, 0.45)';
  ctx.fillRect(0, 0, W, H);

  const cosX = Math.cos(view.tiltX), sinX = Math.sin(view.tiltX);
  const cosY = Math.cos(view.rotY), sinY = Math.sin(view.rotY);
  const cx = W / 2 + view.panX;
  const cy = H / 2 + view.panY;
  const focal = view.focal;
  const zoom = view.zoom;

  const squash = Math.abs(Math.cos(view.tiltX - Math.PI / 2)) * 0.85 + 0.15;

  // 星系外圈辉光
  ctx.globalCompositeOperation = 'lighter';
  const outerR = 420 * zoom;

  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(1, squash);

  const outerGlow = ctx.createRadialGradient(0, 0, outerR * 0.05, 0, 0, outerR);
  outerGlow.addColorStop(0, 'rgba(120, 160, 200, 0.10)');
  outerGlow.addColorStop(0.4, 'rgba(100, 140, 200, 0.05)');
  outerGlow.addColorStop(1, 'rgba(80, 100, 180, 0)');
  ctx.fillStyle = outerGlow;
  ctx.fillRect(-outerR, -outerR, outerR * 2, outerR * 2);
  ctx.restore();

  // 太阳光芒
  const rayBaseLen = 320 * zoom;
  const rayGlobalAngle = view.rotY * 0.08;

  ctx.save();
  ctx.translate(cx, cy);

  for (let i = 0; i < RAYS.length; i++) {
    const ray = RAYS[i];
    const breathe = 0.7 + 0.3 * Math.sin(time * ray.speed + ray.phase);
    const sway = Math.sin(time * ray.swaySpeed + ray.phase * 1.3) * ray.swayAmp;
    const angle = ray.angleOffset + rayGlobalAngle + sway;
    const len = rayBaseLen * ray.lenFactor * breathe;

    const ex = Math.cos(angle) * len;
    const ey = Math.sin(angle) * len;

    const w = 0.45 * zoom;
    const nx = -Math.sin(angle) * w;
    const ny = Math.cos(angle) * w;

    const grad = ctx.createLinearGradient(0, 0, ex, ey);
    grad.addColorStop(0, 'rgba(255, 252, 235, 0.55)');
    grad.addColorStop(0.15, 'rgba(255, 245, 215, 0.28)');
    grad.addColorStop(0.5, 'rgba(220, 235, 255, 0.08)');
    grad.addColorStop(1, 'rgba(180, 210, 255, 0)');

    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(nx, ny);
    ctx.lineTo(ex, ey);
    ctx.lineTo(-nx, -ny);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();

  // 中心强光核
  const coreR = 55 * zoom;

  ctx.save();
  ctx.translate(cx, cy);

  const coreGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, coreR);
  coreGrad.addColorStop(0, 'rgba(255, 255, 255, 0.7)');
  coreGrad.addColorStop(0.12, 'rgba(255, 250, 230, 0.4)');
  coreGrad.addColorStop(0.4, 'rgba(200, 230, 255, 0.1)');
  coreGrad.addColorStop(1, 'rgba(150, 200, 255, 0)');
  ctx.fillStyle = coreGrad;
  ctx.fillRect(-coreR, -coreR, coreR * 2, coreR * 2);
  ctx.restore();

  // 粒子
  for (let i = 0; i < PARTICLE_COUNT; i++) {
    const p = particles[i];

    const x1 = p.x * cosY - p.z * sinY;
    const z1 = p.x * sinY + p.z * cosY;
    const y1 = p.y * cosX - z1 * sinX;
    const z2 = p.y * sinX + z1 * cosX;

    const zCam = z2 + focal;
    if (zCam < 30) continue;
    const k = focal / zCam;

    const sx = x1 * k * zoom + cx;
    const sy = y1 * k * zoom + cy;

    if (sx < -4 || sx > W + 4 || sy < -4 || sy > H + 4) continue;

    const sz = p.size * k * zoom * 2.2;
    if (sz < 0.15) continue;

    const depthAlpha = Math.max(0.05, Math.min(1, (k - 0.4) * 1.7));
    const twinkle = 0.75 + 0.25 * Math.sin(time * p.speed + p.phase);
    const a = p.alpha * depthAlpha * twinkle;
    if (a < 0.015) continue;

    ctx.fillStyle = `rgba(${p.r},${p.g},${p.b},${a.toFixed(2)})`;

    if (sz < 1.4) {
      ctx.fillRect(sx - sz * 0.5, sy - sz * 0.5, sz, sz);
    } else {
      ctx.beginPath();
      ctx.arc(sx, sy, sz * 0.5, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // 心情星（六芒星）
  for (let i = 0; i < records.length; i++) {
    const r = records[i];
    const proj = projectMoodStar(r, cosX, sinX, cosY, sinY, cx, cy, focal, zoom);
    if (!proj) continue;

    const { sx, sy, k } = proj;
    if (sx < -30 || sx > W + 30 || sy < -30 || sy > H + 30) continue;

    const isSelected = (r.id === selectedRecordId);

    const baseR = Math.max(2, 3 * k * zoom);
    const pulse = 0.85 + 0.15 * Math.sin(time * 2 + (r.id % 100));

    const rc = parseInt(r.color.slice(1, 3), 16);
    const gc = parseInt(r.color.slice(3, 5), 16);
    const bc = parseInt(r.color.slice(5, 7), 16);

    // 六芒星：6 根细光刺
    const spikeLen = baseR * (isSelected ? 13 : 9) * pulse;
    const rotBase = time * 0.35 + (r.id % 1000) * 0.01;

    for (let layer = 0; layer < 2; layer++) {
      const layerLen = spikeLen * (1 - layer * 0.42);
      const layerAlpha = (0.35 + layer * 0.4) * k * (isSelected ? 1.4 : 1);
      const layerWidth = (1.4 - layer * 0.7) * zoom;

      ctx.fillStyle = `rgba(${rc},${gc},${bc},${Math.min(1, layerAlpha).toFixed(2)})`;

      for (let s = 0; s < 6; s++) {
        const a = (s / 6) * Math.PI * 2 + rotBase;
        const ex = sx + Math.cos(a) * layerLen;
        const ey = sy + Math.sin(a) * layerLen;
        const nx = -Math.sin(a) * layerWidth;
        const ny = Math.cos(a) * layerWidth;

        ctx.beginPath();
        ctx.moveTo(sx + nx, sy + ny);
        ctx.lineTo(ex, ey);
        ctx.lineTo(sx - nx, sy - ny);
        ctx.closePath();
        ctx.fill();
      }
    }

    // 选中时额外外圈光环
    if (isSelected) {
      ctx.strokeStyle = `rgba(${rc},${gc},${bc},${(0.7).toFixed(2)})`;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(sx, sy, baseR * 8 + Math.sin(time * 4) * 2, 0, Math.PI * 2);
      ctx.stroke();
    }

    // 中心光晕
    ctx.fillStyle = `rgba(${rc},${gc},${bc},${(0.16 * k).toFixed(2)})`;
    ctx.beginPath();
    ctx.arc(sx, sy, baseR * 5.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = `rgba(${rc},${gc},${bc},${(0.4 * k).toFixed(2)})`;
    ctx.beginPath();
    ctx.arc(sx, sy, baseR * 2.4, 0, Math.PI * 2);
    ctx.fill();

    // 星核
    ctx.fillStyle = `rgba(${rc},${gc},${bc},1)`;
    ctx.beginPath();
    ctx.arc(sx, sy, baseR * pulse, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath();
    ctx.arc(sx - baseR * 0.3, sy - baseR * 0.3, baseR * 0.35, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

function loop(t) {
  draw(t);
  requestAnimationFrame(loop);
}

/* =========================================================
   记录详情卡片
   ========================================================= */
const recordCard = document.getElementById('recordCard');
const rcEmoji = document.getElementById('rcEmoji');
const rcMood = document.getElementById('rcMood');
const rcDate = document.getElementById('rcDate');
const rcNote = document.getElementById('rcNote');

function showRecordCard(record) {
  rcEmoji.textContent = record.emoji;
  rcMood.textContent = record.mood;
  rcMood.style.color = record.color;
  rcDate.textContent = record.date;
  if (record.note) {
    rcNote.textContent = record.note;
    rcNote.classList.remove('empty-note');
  } else {
    rcNote.textContent = '（没有留言）';
    rcNote.classList.add('empty-note');
  }
  recordCard.classList.add('show');
}

function hideRecordCard() {
  recordCard.classList.remove('show');
  selectedRecordId = null;
}

document.getElementById('rcClose').addEventListener('click', hideRecordCard);

/* =========================================================
   手势：区分点击与拖动
   ========================================================= */
const pointers = new Map();
let pinchState = null;
let dragState = null;
let tapCandidate = null; // { x, y, time, id }

const TAP_MAX_DIST = 8;      // 移动小于 8px 算点击
const TAP_MAX_TIME = 350;    // 按下小于 350ms 算点击

function localPoint(e) {
  const rect = canvas.getBoundingClientRect();
  return { x: e.clientX - rect.left, y: e.clientY - rect.top };
}

canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  const p = localPoint(e);
  pointers.set(e.pointerId, p);

  view.autoRotate = false;
  inertiaY = 0;
  inertiaX = 0;

  if (pointers.size === 1) {
    dragState = { x: p.x, y: p.y };
    tapCandidate = {
      x: p.x,
      y: p.y,
      time: performance.now(),
      moved: 0
    };
  } else if (pointers.size === 2) {
    tapCandidate = null;
    const [a, b] = [...pointers.values()];
    pinchState = {
      dist: Math.hypot(b.x - a.x, b.y - a.y),
      center: { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }
    };
  }
});

canvas.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  const prev = pointers.get(e.pointerId);
  const p = localPoint(e);
  pointers.set(e.pointerId, p);

  if (pointers.size === 1 && dragState) {
    const dx = p.x - dragState.x;
    const dy = p.y - dragState.y;

    // 累计移动距离（用于区分点击和拖动）
    if (tapCandidate) {
      tapCandidate.moved += Math.hypot(dx, dy);
    }

    const rotDelta = dx * 0.011;
    view.rotY += rotDelta;
    view.tiltX = Math.max(0.15, Math.min(1.5, view.tiltX + dy * 0.007));

    inertiaY = rotDelta;
    inertiaX = dy * 0.007 * 0.5;

    dragState = { x: p.x, y: p.y };
  } else if (pointers.size === 2 && pinchState) {
    const [a, b] = [...pointers.values()];
    const dist = Math.hypot(b.x - a.x, b.y - a.y);
    const center = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };

    if (pinchState.dist > 0 && dist > 0) {
      const factor = dist / pinchState.dist;
      view.zoom = Math.max(0.4, Math.min(6, view.zoom * factor));
    }

    const cdx = center.x - pinchState.center.x;
    const cdy = center.y - pinchState.center.y;

    const rotDelta = cdx * 0.008;
    view.rotY += rotDelta;
    view.tiltX = Math.max(0.15, Math.min(1.5, view.tiltX + cdy * 0.005));

    inertiaY = rotDelta;
    inertiaX = cdy * 0.005 * 0.5;

    pinchState.dist = dist;
    pinchState.center = center;
  }
});

function endPointer(e) {
  if (!pointers.has(e.pointerId)) return;
  const p = pointers.get(e.pointerId);
  pointers.delete(e.pointerId);

  if (pointers.size < 2) pinchState = null;

  if (pointers.size === 0) {
    dragState = null;

    // 判断是否是点击
    if (tapCandidate) {
      const elapsed = performance.now() - tapCandidate.time;
      if (tapCandidate.moved < TAP_MAX_DIST && elapsed < TAP_MAX_TIME) {
        // 尝试命中心情星
        const hit = findMoodStarAt(tapCandidate.x, tapCandidate.y);
        if (hit) {
          selectedRecordId = hit.id;
          showRecordCard(hit);
        } else {
          // 点空白处关闭卡片
          hideRecordCard();
        }
      }
      tapCandidate = null;
    }

    setTimeout(() => {
      if (pointers.size === 0 && Math.abs(inertiaY) < 0.001 && Math.abs(inertiaX) < 0.001) {
        view.autoRotate = true;
      }
    }, 1800);
  }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);

/* =========================================================
   命中检测：找离点击点最近的心情星
   ========================================================= */
const HIT_RADIUS = 28; // 点击命中半径（像素），因为六芒星不大

function findMoodStarAt(px, py) {
  if (records.length === 0) return null;

  let best = null;
  let bestDist2 = HIT_RADIUS * HIT_RADIUS;

  for (let i = 0; i < records.length; i++) {
    const r = records[i];
    const proj = projectMoodStarNow(r);
    if (!proj) continue;

    const dx = proj.sx - px;
    const dy = proj.sy - py;
    const d2 = dx * dx + dy * dy;

    if (d2 < bestDist2) {
      bestDist2 = d2;
      best = r;
    }
  }
  return best;
}

/* =========================================================
   滚轮 & 按钮
   ========================================================= */
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.12 : 1 / 1.12;
  view.zoom = Math.max(0.4, Math.min(6, view.zoom * factor));
}, { passive: false });

document.getElementById('zoomIn').addEventListener('click', () => {
  view.zoom = Math.min(6, view.zoom * 1.3);
});
document.getElementById('zoomOut').addEventListener('click', () => {
  view.zoom = Math.max(0.4, view.zoom / 1.3);
});
document.getElementById('resetView').addEventListener('click', () => {
  resetView();
  hideRecordCard();
});

/* =========================================================
   心情选项与记录
   ========================================================= */
const moodPicker = document.getElementById('moodPicker');
const moodPreview = document.getElementById('moodPreview');
const noteInput = document.getElementById('note');
const dateInput = document.getElementById('date');
const countLabel = document.getElementById('countLabel');

function renderMoodPicker() {
  moodPicker.innerHTML = '';
  MOODS.forEach((m, idx) => {
    const btn = document.createElement('button');
    btn.className = 'mood-btn' + (idx === 0 ? ' active' : '');
    btn.innerHTML = `<span>${m.emoji}</span><span>${m.mood}</span>`;
    btn.addEventListener('click', () => {
      selectedMood = m;
      moodPreview.textContent = m.emoji;
      document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      if (navigator.vibrate) navigator.vibrate(8);
    });
    moodPicker.appendChild(btn);
  });
  moodPreview.textContent = MOODS[0].emoji;
}

const now = new Date();
const pad = n => String(n).padStart(2, '0');
dateInput.value = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;

document.getElementById('saveBtn').addEventListener('click', () => {
  const date = dateInput.value;
  if (!date) { alert('请选择日期'); return; }

  records.push({
    id: ++idCounter,   // 严格递增，绝不会与已有记录相同
    mood: selectedMood.mood,
    emoji: selectedMood.emoji,
    color: selectedMood.color,
    note: noteInput.value.trim(),
    date
  });
  localStorage.setItem('moodRecords', JSON.stringify(records));

  noteInput.value = '';
  noteInput.style.height = '';
  if (navigator.vibrate) navigator.vibrate([8, 30, 8]);
  updateCount();
  renderTimeline();
});

noteInput.addEventListener('input', () => {
  noteInput.style.height = 'auto';
  noteInput.style.height = Math.min(noteInput.scrollHeight, 72) + 'px';
});

function updateCount() {
  countLabel.textContent = records.length ? `${records.length} 条记录` : '还没有记录';
}

/* =========================================================
   时光轴
   ========================================================= */
const timelineDrawer = document.getElementById('timelineDrawer');
const timelineList = document.getElementById('timelineList');

document.getElementById('toggleTimeline').addEventListener('click', () => {
  timelineDrawer.classList.add('open');
  renderTimeline();
});
document.getElementById('closeTimeline').addEventListener('click', () => {
  timelineDrawer.classList.remove('open');
});

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function renderTimeline() {
  if (records.length === 0) {
    timelineList.innerHTML = '<div class="empty">还没有记录，写下第一条心情吧 ✨</div>';
    return;
  }
  const sorted = [...records].sort((a, b) => {
    if (a.date !== b.date) return b.date.localeCompare(a.date);
    return b.id - a.id;
  });
  timelineList.innerHTML = sorted.map(r => `
    <div class="timeline-item" style="border-left-color: ${r.color}">
      <button class="delete-btn" data-id="${r.id}">✕</button>
      <div class="date">${r.date}</div>
      <div class="content">
        <div class="emoji">${r.emoji}</div>
        <div class="text">
          <div class="mood-name" style="color: ${r.color}">${r.mood}</div>
          ${r.note ? `<div>${escapeHtml(r.note)}</div>` : ''}
        </div>
      </div>
    </div>
  `).join('');

  timelineList.querySelectorAll('.delete-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = Number(btn.dataset.id);
      if (confirm('确定删除这条记录吗？')) {
        records = records.filter(r => r.id !== id);
        localStorage.setItem('moodRecords', JSON.stringify(records));
        if (selectedRecordId === id) hideRecordCard();
        updateCount();
        renderTimeline();
      }
    });
  });
}

/* =========================================================
   初始化
   ========================================================= */
function init() {
  renderMoodPicker();
  updateCount();
  requestAnimationFrame(() => {
    if (resizeCanvas()) resetView();
    requestAnimationFrame(() => {
      if (resizeCanvas()) resetView();
      lastT = performance.now();
      requestAnimationFrame(loop);
    });
  });
}

let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if (resizeCanvas()) resetView(); }, 150);
});
window.addEventListener('orientationchange', () => {
  setTimeout(() => { if (resizeCanvas()) resetView(); }, 300);
});

init();
</script>
