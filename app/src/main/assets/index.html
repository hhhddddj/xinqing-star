<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#060608">
<title>心情星云</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #060608; color: #e0e0e0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow: hidden;
  }
  .app {
    height: 100vh;
    display: flex; flex-direction: column;
    padding: max(env(safe-area-inset-top), 12px) 14px max(env(safe-area-inset-bottom), 14px);
    max-width: 560px; margin: 0 auto; gap: 10px;
  }
  .header { display: flex; align-items: center; justify-content: space-between; padding: 0 4px; }
  .title { font-size: 1.1rem; font-weight: 600; letter-spacing: 2px; color: #e8c766; }
  .header-actions { display: flex; gap: 6px; }
  .icon-btn {
    background: none; border: none; color: #777;
    font-size: 18px; cursor: pointer; padding: 4px 8px; line-height: 1;
  }
  .icon-btn:active { color: #e8c766; }

  .mood-tabs {
    display: flex; gap: 6px; overflow-x: auto;
    padding: 0 2px 2px;
    scrollbar-width: none;
  }
  .mood-tabs::-webkit-scrollbar { display: none; }
  .mood-btn {
    flex-shrink: 0;
    padding: 6px 12px;
    border-radius: 8px;
    background: #151515;
    border: 1px solid #262626;
    color: #888;
    font-size: 13px;
    cursor: pointer;
    transition: all .15s;
    display: flex; align-items: center; gap: 4px;
    user-select: none; -webkit-user-select: none;
  }
  .mood-btn.active {
    background: #2a2418;
    border-color: #e8c766;
    color: #e8c766;
  }
  /* 新建心情的 + 按钮 */
  .mood-add-btn {
    flex-shrink: 0;
    padding: 6px 12px;
    border-radius: 8px;
    background: #151515;
    border: 1px dashed #3a3a3a;
    color: #666;
    font-size: 13px;
    cursor: pointer;
    transition: all .15s;
    display: flex; align-items: center;
    user-select: none; -webkit-user-select: none;
  }
  .mood-add-btn:active { color: #e8c766; border-color: #e8c766; }
  .mood-icon {
    width: 20px; height: 20px;
    object-fit: contain;
    display: block;
    vertical-align: middle;
    border-radius: 3px;
  }

  .canvas-wrap {
    flex: 1; position: relative;
    border-radius: 14px; overflow: hidden;
    background: #060608; min-height: 280px;
  }
  #starMap {
    width: 100%; height: 100%;
    display: block; touch-action: none; cursor: grab;
  }
  #starMap:active { cursor: grabbing; }
  .canvas-hint {
    position: absolute; bottom: 8px; left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    color: rgba(255,255,255,0.22);
    pointer-events: none; white-space: nowrap; letter-spacing: 0.5px;
  }
  .zoom-controls {
    position: absolute; right: 10px; top: 10px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .zoom-btn {
    width: 30px; height: 30px; border-radius: 8px;
    background: rgba(15,15,15,0.7);
    border: 1px solid rgba(255,255,255,0.1);
    color: #bbb; font-size: 15px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    padding: 0;
  }
  .zoom-btn:active { background: rgba(232,199,102,0.25); }

  .record-card {
    position: absolute;
    left: 12px; right: 12px; bottom: 12px;
    background: rgba(20, 20, 26, 0.92);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 14px;
    padding: 14px 16px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 12px 36px rgba(0,0,0,0.6);
    transform: translateY(120%); opacity: 0;
    transition: transform .28s cubic-bezier(0.22, 1, 0.36, 1), opacity .2s;
    pointer-events: none; z-index: 5;
  }
  .record-card.show { transform: translateY(0); opacity: 1; pointer-events: auto; }
  .record-card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .record-card-emoji { font-size: 26px; line-height: 1; display: flex; align-items: center; }
  .record-card-emoji .mood-icon { width: 30px; height: 30px; }
  .record-card-meta { flex: 1; min-width: 0; }
  .record-card-mood { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
  .record-card-date { font-size: 11px; color: #777; }
  .record-card-edit, .record-card-close {
    background: none; border: none; color: #777;
    cursor: pointer; padding: 4px; line-height: 1; flex-shrink: 0;
  }
  .record-card-edit { font-size: 16px; }
  .record-card-close { font-size: 18px; }
  .record-card-edit:active { color: #e8c766; }
  .record-card-close:active { color: #fff; }
  .record-card-note {
    font-size: 14px; line-height: 1.5; color: #d0d0d0;
    word-break: break-word; white-space: pre-wrap;
    max-height: 120px; overflow-y: auto;
  }
  .record-card-note.empty-note { color: #555; font-style: italic; }

  .input-bar {
    background: #121212; border: 1px solid #242424;
    border-radius: 12px;
    padding: 8px 10px 8px 12px;
    display: flex; align-items: center; gap: 8px;
    transition: border-color .15s;
  }
  .input-bar.editing { border-color: #e8c766; }
  .input-bar .mood-preview {
    font-size: 20px;
    width: 28px; height: 28px; text-align: center;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .input-bar .mood-preview .mood-icon { width: 24px; height: 24px; }
  .input-bar textarea {
    flex: 1;
    background: transparent; border: none;
    color: #e0e0e0; font-size: 15px;
    resize: none; font-family: inherit; outline: none;
    line-height: 1.4;
    max-height: 72px; min-height: 22px;
    padding: 4px 0;
  }
  .input-bar textarea::placeholder { color: #555; }
  .send-btn {
    background: #e8c766; border: none; border-radius: 8px;
    color: #111; padding: 7px 14px;
    font-size: 13px; font-weight: 600;
    cursor: pointer; flex-shrink: 0;
  }
  .send-btn:active { opacity: .8; }

  .footer {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 12px; color: #666; padding: 0 4px;
  }
  .footer input[type="date"] {
    background: #121212; border: 1px solid #242424;
    border-radius: 6px; color: #aaa;
    padding: 4px 8px; font-size: 12px;
    outline: none; color-scheme: dark;
    transition: border-color .15s, box-shadow .15s;
  }
  .footer input[type="date"].warn {
    border-color: #ff6b6b;
    box-shadow: 0 0 0 2px rgba(255,107,107,0.25);
    animation: shake .4s;
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-4px); }
    40% { transform: translateX(4px); }
    60% { transform: translateX(-3px); }
    80% { transform: translateX(3px); }
  }

  .timeline-drawer {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: #0f0f0f;
    border-top: 1px solid #2a2a2a;
    border-radius: 16px 16px 0 0;
    padding: 14px 14px max(env(safe-area-inset-bottom), 14px);
    max-height: 55vh; overflow-y: auto;
    transform: translateY(105%);
    transition: transform .28s cubic-bezier(0.22, 1, 0.36, 1);
    z-index: 100;
  }
  .timeline-drawer.open { transform: translateY(0); }
  .timeline-drawer-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 10px;
  }
  .timeline-drawer-header h3 { margin: 0; font-size: 14px; color: #ccc; font-weight: 500; }
  .timeline-drawer-header .right { display: flex; gap: 4px; align-items: center; }
  .text-btn {
    background: none; border: none;
    color: #888; font-size: 12px;
    cursor: pointer; padding: 4px 6px;
  }
  .text-btn:active { color: #e8c766; }
  .close-btn {
    background: none; border: none;
    color: #777; font-size: 18px;
    cursor: pointer; padding: 4px;
  }
  .timeline-item {
    background: #1a1a1a; border-radius: 10px; padding: 10px;
    margin-bottom: 8px; border-left: 3px solid #a78bfa;
    position: relative;
  }
  .timeline-item .date { font-size: 11px; color: #666; margin-bottom: 3px; }
  .timeline-item .content { display: flex; gap: 8px; align-items: flex-start; }
  .timeline-item .emoji {
    font-size: 18px; line-height: 1;
    display: flex; align-items: center;
    flex-shrink: 0;
  }
  .timeline-item .emoji .mood-icon { width: 22px; height: 22px; }
  .timeline-item .text { flex: 1; font-size: 13px; line-height: 1.4; word-break: break-word; }
  .timeline-item .mood-name { font-weight: 600; margin-bottom: 2px; font-size: 12px; }
  .delete-btn {
    position: absolute; top: 5px; right: 5px;
    background: none; border: none; color: #555;
    font-size: 13px; cursor: pointer;
    padding: 4px; line-height: 1;
  }
  .delete-btn:active { color: #ff6b6b; }
  .empty { text-align: center; color: #555; padding: 20px; font-size: 13px; }

  /* ===== 通用 modal ===== */
  .modal {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    display: none;
    align-items: center; justify-content: center;
    z-index: 250;
    padding: 20px;
  }
  .modal.show { display: flex; }
  .modal-content {
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 14px;
    width: 100%; max-width: 360px;
    padding: 18px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.7);
    text-align: center;
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal-content h3 {
    margin: 0 0 14px;
    font-size: 15px; color: #ddd; font-weight: 500;
  }
  .modal-preview {
    width: 80px; height: 80px;
    margin: 0 auto 14px;
    background: #0d0d0d;
    border: 1px solid #2a2a2a;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 40px;
    overflow: hidden;
  }
  .modal-preview img { width: 64px; height: 64px; object-fit: contain; }
  .modal-hint {
    font-size: 11px; color: #666;
    margin: 0 0 12px;
    line-height: 1.4;
    text-align: left;
  }
  .modal-hint.err { color: #ff6b6b; }
  .modal-hint.ok { color: #6BCB77; }
  .modal-btn {
    display: block;
    width: 100%;
    background: #2a2a2a;
    border: 1px solid #333;
    color: #ccc;
    padding: 10px;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
    margin-bottom: 8px;
  }
  .modal-btn:active { opacity: .8; }
  .modal-btn.primary {
    background: #e8c766;
    border-color: #e8c766;
    color: #111;
    font-weight: 600;
  }
  .modal-btn.danger {
    color: #ff6b6b;
    border-color: #3a2222;
  }
  .modal-btn.danger:active { background: #2a1a1a; }

  /* 新建心情表单 */
  .form-row {
    margin-bottom: 10px;
    text-align: left;
  }
  .form-row label {
    display: block;
    font-size: 12px;
    color: #888;
    margin-bottom: 4px;
  }
  .form-row input[type="text"] {
    width: 100%;
    background: #0d0d0d;
    border: 1px solid #2a2a2a;
    border-radius: 8px;
    color: #e0e0e0;
    font-size: 14px;
    padding: 9px 10px;
    outline: none;
    font-family: inherit;
  }
  .form-row input[type="text"]:focus {
    border-color: #e8c766;
  }
  .color-picker {
    display: flex; flex-wrap: wrap;
    gap: 8px;
    margin-top: 2px;
  }
  .color-swatch {
    width: 32px; height: 32px;
    border-radius: 8px;
    border: 2px solid transparent;
    cursor: pointer;
    transition: transform .1s;
  }
  .color-swatch:active { transform: scale(0.9); }
  .color-swatch.selected {
    border-color: #fff;
    box-shadow: 0 0 0 2px rgba(232,199,102,0.5);
  }

  /* ===== 备份弹层 ===== */
  .backup-modal {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    display: none;
    align-items: center; justify-content: center;
    z-index: 200; padding: 20px;
  }
  .backup-modal.show { display: flex; }
  .backup-content {
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 14px;
    width: 100%; max-width: 480px;
    max-height: 85vh;
    display: flex; flex-direction: column;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.7);
  }
  .backup-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 16px;
    border-bottom: 1px solid #2a2a2a;
  }
  .backup-header h3 { margin: 0; font-size: 15px; color: #ddd; font-weight: 500; }
  .backup-body { padding: 14px 16px; overflow-y: auto; }
  .backup-hint { font-size: 12px; color: #888; line-height: 1.5; margin: 0 0 10px; }
  .backup-body textarea {
    width: 100%;
    background: #0d0d0d;
    border: 1px solid #2a2a2a;
    border-radius: 8px;
    color: #ccc;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 11px;
    padding: 10px;
    resize: vertical;
    min-height: 180px; max-height: 40vh;
    outline: none; line-height: 1.4;
  }
  .backup-actions { display: flex; gap: 8px; margin-top: 12px; }
  .backup-btn {
    flex: 1;
    background: #2a2a2a;
    border: 1px solid #333;
    color: #ccc;
    padding: 9px; border-radius: 8px;
    font-size: 13px; cursor: pointer;
  }
  .backup-btn:active { opacity: .8; }
  .backup-btn.primary {
    background: #e8c766; border-color: #e8c766; color: #111; font-weight: 600;
  }
  .import-status {
    margin-top: 10px;
    font-size: 12px; line-height: 1.4;
    min-height: 16px;
    word-break: break-word;
  }
  .import-status.ok { color: #6BCB77; }
  .import-status.err { color: #ff6b6b; }

  /* ===== 撤销删除 toast ===== */
  .undo-toast {
    position: fixed;
    bottom: 24px; left: 50%;
    transform: translate(-50%, 150%);
    background: rgba(30, 30, 35, 0.96);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px;
    padding: 12px 16px;
    display: flex; align-items: center; gap: 14px;
    font-size: 13px; color: #ddd;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    transition: transform .28s cubic-bezier(0.22, 1, 0.36, 1);
    z-index: 150;
    white-space: nowrap;
  }
  .undo-toast.show { transform: translate(-50%, 0); }
  .undo-btn {
    background: none; border: none;
    color: #e8c766; font-size: 13px; font-weight: 600;
    cursor: pointer; padding: 0;
  }
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <div class="title">心情星云</div>
    <div class="header-actions">
      <button class="icon-btn" id="resetView" title="复位视角">⟳</button>
      <button class="icon-btn" id="toggleTimeline" title="时光轴">☰</button>
    </div>
  </div>

  <div class="mood-tabs" id="moodPicker"></div>

  <div class="canvas-wrap">
    <canvas id="starMap"></canvas>
    <div class="canvas-hint">点星查看 · 拖动旋转 · 双指缩放 · 长按心情换图 / 删除</div>
    <div class="zoom-controls">
      <button class="zoom-btn" id="zoomIn">＋</button>
      <button class="zoom-btn" id="zoomOut">−</button>
    </div>

    <div class="record-card" id="recordCard">
      <div class="record-card-header">
        <div class="record-card-emoji" id="rcEmoji">😊</div>
        <div class="record-card-meta">
          <div class="record-card-mood" id="rcMood">开心</div>
          <div class="record-card-date" id="rcDate">2025-01-01</div>
        </div>
        <button class="record-card-edit" id="rcEdit" title="编辑">✎</button>
        <button class="record-card-close" id="rcClose">✕</button>
      </div>
      <div class="record-card-note" id="rcNote"></div>
    </div>
  </div>

  <div class="input-bar" id="inputBar">
    <div class="mood-preview" id="moodPreview">☁️</div>
    <textarea id="note" placeholder="虚空里捞得一句话…" rows="1"></textarea>
    <button class="send-btn" id="saveBtn">记录</button>
  </div>

  <div class="footer">
    <input type="date" id="date">
    <span id="countLabel" style="color:#555;">还没有记录</span>
  </div>
</div>

<div class="timeline-drawer" id="timelineDrawer">
  <div class="timeline-drawer-header">
    <h3>时光轴</h3>
    <div class="right">
      <button class="text-btn" id="openExportBtn">备份</button>
      <button class="text-btn" id="openImportBtn">恢复</button>
      <button class="close-btn" id="closeTimeline">✕</button>
    </div>
  </div>
  <div id="timelineList"></div>
</div>

<!-- 心情操作面板（长按打开） -->
<div class="modal" id="moodActionModal">
  <div class="modal-content">
    <h3 id="moodActionTitle">心情操作</h3>
    <div class="modal-preview" id="moodActionPreview"></div>
    <p class="modal-hint" id="moodActionHint"></p>
    <button class="modal-btn primary" id="pickImageBtn">从相册选择图片</button>
    <button class="modal-btn" id="resetIconBtn">恢复默认 emoji</button>
    <button class="modal-btn danger" id="deleteMoodBtn" style="display:none;">删除这个心情</button>
    <button class="modal-btn" id="cancelMoodActionBtn">取消</button>
  </div>
</div>

<!-- 新建心情面板 -->
<div class="modal" id="newMoodModal">
  <div class="modal-content">
    <h3>新建心情</h3>
    <div class="form-row">
      <label>名字（1-4 个字）</label>
      <input type="text" id="newMoodName" maxlength="4" placeholder="例如：期待" autocomplete="off">
    </div>
    <div class="form-row">
      <label>默认 emoji（选填）</label>
      <input type="text" id="newMoodEmoji" maxlength="4" placeholder="😀" autocomplete="off">
    </div>
    <div class="form-row">
      <label>颜色</label>
      <div class="color-picker" id="colorPicker"></div>
    </div>
    <p class="modal-hint" id="newMoodHint"></p>
    <button class="modal-btn primary" id="createMoodBtn">创建</button>
    <button class="modal-btn" id="cancelNewMoodBtn">取消</button>
  </div>
</div>

<input type="file" accept="image/*" id="iconFileInput" style="display:none">

<!-- 备份弹层 -->
<div class="backup-modal" id="backupModal">
  <div class="backup-content">
    <div class="backup-header">
      <h3 id="backupTitle">导出记录</h3>
      <button class="close-btn" id="closeBackup">✕</button>
    </div>
    <div class="backup-body">
      <div id="exportPanel">
        <p class="backup-hint">下面是全部数据（心情列表 + 记录）的 JSON。复制保存到任何地方，换设备或数据丢失时用「恢复」拉回来。</p>
        <textarea id="exportText" readonly></textarea>
        <div class="backup-actions">
          <button class="backup-btn primary" id="copyExportBtn">复制全部</button>
          <button class="backup-btn" id="downloadExportBtn">下载文件</button>
        </div>
      </div>
      <div id="importPanel" style="display:none;">
        <p class="backup-hint">粘贴之前备份的 JSON，点「导入」。心情按名字合并，记录按 id 合并。</p>
        <textarea id="importText" placeholder="粘贴 JSON…"></textarea>
        <div class="backup-actions">
          <button class="backup-btn primary" id="doImportBtn">导入</button>
        </div>
        <div class="import-status" id="importStatus"></div>
      </div>
    </div>
  </div>
</div>

<div class="undo-toast" id="undoToast">
  <span>已删除一条记录</span>
  <button class="undo-btn" id="undoBtn">撤销</button>
</div>

<script>
/* ============ 工具 ============ */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ============ 默认心情（内置，不可删） ============ */
const DEFAULT_MOODS = [
  { name: '开心', emoji: '😊', color: '#FFD93D', icon: null, builtin: true },
  { name: '平静', emoji: '😌', color: '#6BCB77', icon: null, builtin: true },
  { name: '难过', emoji: '😢', color: '#4D96FF', icon: null, builtin: true },
  { name: '生气', emoji: '😠', color: '#FF6B6B', icon: null, builtin: true },
  { name: '焦虑', emoji: '😰', color: '#B06BFF', icon: null, builtin: true },

/* 心情查询辅助 */
function findMood(name) {

/* 渲染心情图标 HTML（图标优先级：自定义图 > emoji） */

/* ============ 星云粒子 ============ */
const PARTICLE_COUNT = 3600;

function colorAt(t) {
  const stops = [
    [0.00, 255, 255, 255],
    [0.10, 235, 245, 255],
    [0.22, 180, 240, 245],
    [0.36, 110, 230, 180],
    [0.52, 130, 200, 150],
    [0.68, 230, 150, 170],
    [0.84, 200, 130, 230],
    [1.00, 130, 90, 200]
  ];
  for (let i = 0; i < stops.length - 1; i++) {
    const a = stops[i], b = stops[i + 1];
    if (t >= a[0] && t <= b[0]) {
      const k = (t - a[0]) / (b[0] - a[0]);
      return [
        Math.round(a[1] + (b[1] - a[1]) * k),
        Math.round(a[2] + (b[2] - a[2]) * k),
        Math.round(a[3] + (b[3] - a[3]) * k)
      ];
    }
  }
  return [255, 255, 255];
}

const particles = new Array(PARTICLE_COUNT);
(function initParticles() {
  const rand = mulberry32(88888);
  for (let i = 0; i < PARTICLE_COUNT; i++) {
    const rf = Math.pow(rand(), 2.6);
    const ringMod = 1 + 0.06 * Math.sin(rf * 22);
    const radius = rf * 720 * ringMod;
    const angle = rand() * Math.PI * 2;
    const px = Math.cos(angle) * radius;
    const pz = Math.sin(angle) * radius;
    const thickness = 12 + (1 - rf) * 40;
    const py = (rand() - 0.5) * thickness;
    const [r, g, b] = colorAt(rf);
    const size = 0.28 + rand() * 0.55 * (1 - rf * 0.3);
    const alpha = 0.25 + rand() * 0.55 * (1 - rf * 0.5);
    particles[i] = {
      x: px, y: py, z: pz, r, g, b, size, alpha,
      phase: rand() * Math.PI * 2,
      speed: 0.5 + rand() * 1.6
    };
  }
})();

/* ============ 太阳光线 ============ */
const RAYS = (function () {
  const rand = mulberry32(20250501);
  const list = [];
  const COUNT = 56;
  for (let i = 0; i < COUNT; i++) {
    list.push({
      angleOffset: (i / COUNT) * Math.PI * 2,
      lenFactor: 0.25 + rand() * 0.75,
      phase: rand() * Math.PI * 2,
      speed: 0.6 + rand() * 1.2,
      swayAmp: 0.01 + rand() * 0.025,
      swaySpeed: 0.3 + rand() * 0.5
    });
  }
  return list;
})();

/* ============ 画布 ============ */
const canvas = document.getElementById('starMap');
const ctx = canvas.getContext('2d', { alpha: false });
let W = 0, H = 0, DPR = 1;

const view = {
  zoom: 1, panX: 0, panY: 0,
  tiltX: 1.02, rotY: 0,
  autoRotate: true, focal: 700
};
let inertiaY = 0, inertiaX = 0;

function resizeCanvas() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const rect = canvas.getBoundingClientRect();
  if (rect.width === 0 || rect.height === 0) return false;
  W = rect.width; H = rect.height;
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  return true;
}

function resetView() {
  view.zoom = 1; view.panX = 0; view.panY = 0;
  view.tiltX = 1.02; view.rotY = 0;
  inertiaY = 0; inertiaX = 0;
  view.autoRotate = true;
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#060608';
  ctx.fillRect(0, 0, W, H);
}

/* 星图位置基于记录的 id（用数字种子），跟心情名字无关 */
function moodStarPos(record) {
  const rand = mulberry32(record.id);
  const angle = rand() * Math.PI * 2;
  const radius = 90 + Math.pow(rand(), 0.8) * 170;
  return {
    x: Math.cos(angle) * radius,
    y: (rand() - 0.5) * 14,
    z: Math.sin(angle) * radius
  };
}

function projectMoodStar(record, cosX, sinX, cosY, sinY, cx, cy, focal, zoom) {
  const p = moodStarPos(record);
  const x1 = p.x * cosY - p.z * sinY;
  const z1 = p.x * sinY + p.z * cosY;
  const y1 = p.y * cosX - z1 * sinX;
  const z2 = p.y * sinX + z1 * cosX;
  const zCam = z2 + focal;
  if (zCam < 30) return null;
  const k = focal / zCam;
  return {
    sx: x1 * k * zoom + cx,
    sy: y1 * k * zoom + cy,
    k
  };
}

function projectMoodStarNow(record) {
  const cosX = Math.cos(view.tiltX), sinX = Math.sin(view.tiltX);
  const cosY = Math.cos(view.rotY), sinY = Math.sin(view.rotY);
  const cx = W / 2 + view.panX;
  const cy = H / 2 + view.panY;
  return projectMoodStar(record, cosX, sinX, cosY, sinY, cx, cy, view.focal, view.zoom);
}

/* ============ 渲染 ============ */
let lastT = 0;
let selectedRecordId = null;

function draw(t) {
  if (!W || !H) return;
  const time = t / 1000;
  const dt = lastT ? Math.min((t - lastT) / 1000, 0.05) : 0.016;
  lastT = t;

  if (view.autoRotate) view.rotY += dt * 0.10;
  if (Math.abs(inertiaY) > 0.00005) {
    view.rotY += inertiaY; inertiaY *= 0.94;
  } else inertiaY = 0;
  if (Math.abs(inertiaX) > 0.00005) {
    view.tiltX = Math.max(0.15, Math.min(1.5, view.tiltX + inertiaX));
    inertiaX *= 0.94;
  } else inertiaX = 0;

  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.fillStyle = 'rgba(6, 6, 8, 0.45)';
  ctx.fillRect(0, 0, W, H);

  const cosX = Math.cos(view.tiltX), sinX = Math.sin(view.tiltX);
  const cosY = Math.cos(view.rotY), sinY = Math.sin(view.rotY);
  const cx = W / 2 + view.panX;
  const cy = H / 2 + view.panY;
  const focal = view.focal;
  const zoom = view.zoom;
  const squash = Math.abs(Math.cos(view.tiltX - Math.PI / 2)) * 0.85 + 0.15;

  ctx.globalCompositeOperation = 'lighter';
  const outerR = 420 * zoom;

  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(1, squash);
  const outerGlow = ctx.createRadialGradient(0, 0, outerR * 0.05, 0, 0, outerR);
  outerGlow.addColorStop(0, 'rgba(120, 160, 200, 0.10)');
  outerGlow.addColorStop(0.4, 'rgba(100, 140, 200, 0.05)');
  outerGlow.addColorStop(1, 'rgba(80, 100, 180, 0)');
  ctx.fillStyle = outerGlow;
  ctx.fillRect(-outerR, -outerR, outerR * 2, outerR * 2);
  ctx.restore();

  const rayBaseLen = 320 * zoom;
  const rayGlobalAngle = view.rotY * 0.08;

  ctx.save();
  ctx.translate(cx, cy);
  for (let i = 0; i < RAYS.length; i++) {
    const ray = RAYS[i];
    const breathe = 0.7 + 0.3 * Math.sin(time * ray.speed + ray.phase);
    const sway = Math.sin(time * ray.swaySpeed + ray.phase * 1.3) * ray.swayAmp;
    const angle = ray.angleOffset + rayGlobalAngle + sway;
    const len = rayBaseLen * ray.lenFactor * breathe;
    const ex = Math.cos(angle) * len;
    const ey = Math.sin(angle) * len;
    const w = 0.45 * zoom;
    const nx = -Math.sin(angle) * w;
    const ny = Math.cos(angle) * w;
    const grad = ctx.createLinearGradient(0, 0, ex, ey);
    grad.addColorStop(0, 'rgba(255, 252, 235, 0.55)');
    grad.addColorStop(0.15, 'rgba(255, 245, 215, 0.28)');
    grad.addColorStop(0.5, 'rgba(220, 235, 255, 0.08)');
    grad.addColorStop(1, 'rgba(180, 210, 255, 0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(nx, ny);
    ctx.lineTo(ex, ey);
    ctx.lineTo(-nx, -ny);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();

  const coreR = 55 * zoom;
  ctx.save();
  ctx.translate(cx, cy);
  const coreGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, coreR);
  coreGrad.addColorStop(0, 'rgba(255, 255, 255, 0.7)');
  coreGrad.addColorStop(0.12, 'rgba(255, 250, 230, 0.4)');
  coreGrad.addColorStop(0.4, 'rgba(200, 230, 255, 0.1)');
  coreGrad.addColorStop(1, 'rgba(150, 200, 255, 0)');
  ctx.fillStyle = coreGrad;
  ctx.fillRect(-coreR, -coreR, coreR * 2, coreR * 2);
  ctx.restore();

  for (let i = 0; i < PARTICLE_COUNT; i++) {
    const p = particles[i];
    const x1 = p.x * cosY - p.z * sinY;
    const z1 = p.x * sinY + p.z * cosY;
    const y1 = p.y * cosX - z1 * sinX;
    const z2 = p.y * sinX + z1 * cosX;
    const zCam = z2 + focal;
    if (zCam < 30) continue;
    const k = focal / zCam;
    const sx = x1 * k * zoom + cx;
    const sy = y1 * k * zoom + cy;
    if (sx < -4 || sx > W + 4 || sy < -4 || sy > H + 4) continue;
    const sz = p.size * k * zoom * 2.2;
    if (sz < 0.15) continue;
    const depthAlpha = Math.max(0.05, Math.min(1, (k - 0.4) * 1.7));
    const twinkle = 0.75 + 0.25 * Math.sin(time * p.speed + p.phase);
    const a = p.alpha * depthAlpha * twinkle;
    if (a < 0.015) continue;
    ctx.fillStyle = 'rgba(' + p.r + ',' + p.g + ',' + p.b + ',' + a.toFixed(2) + ')';
    if (sz < 1.4) {
      ctx.fillRect(sx - sz * 0.5, sy - sz * 0.5, sz, sz);
    } else {
      ctx.beginPath();
      ctx.arc(sx, sy, sz * 0.5, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  for (let i = 0; i < records.length; i++) {
    const r = records[i];
    const proj = projectMoodStar(r, cosX, sinX, cosY, sinY, cx, cy, focal, zoom);
    if (!proj) continue;
    const sx = proj.sx, sy = proj.sy, k = proj.k;
    if (sx < -30 || sx > W + 30 || sy < -30 || sy > H + 30) continue;

    const isSelected = (r.id === selectedRecordId);
    const baseR = Math.max(2, 3 * k * zoom);
    const pulse = 0.85 + 0.15 * Math.sin(time * 2 + (r.id % 100));

    // 颜色从当前 moods 查询；查不到用灰色
    const colorHex = moodColorByName(r.mood);
    const rc = parseInt(colorHex.slice(1, 3), 16);
    const gc = parseInt(colorHex.slice(3, 5), 16);
    const bc = parseInt(colorHex.slice(5, 7), 16);

    const spikeLen = baseR * (isSelected ? 13 : 9) * pulse;
    const rotBase = time * 0.35 + (r.id % 1000) * 0.01;

    for (let layer = 0; layer < 2; layer++) {
      const layerLen = spikeLen * (1 - layer * 0.42);
      const layerAlpha = (0.35 + layer * 0.4) * k * (isSelected ? 1.4 : 1);
      const layerWidth = (1.4 - layer * 0.7) * zoom;
      ctx.fillStyle = 'rgba(' + rc + ',' + gc + ',' + bc + ',' + Math.min(1, layerAlpha).toFixed(2) + ')';
      for (let s = 0; s < 6; s++) {
        const a = (s / 6) * Math.PI * 2 + rotBase;
        const ex = sx + Math.cos(a) * layerLen;
        const ey = sy + Math.sin(a) * layerLen;
        const nx = -Math.sin(a) * layerWidth;
        const ny = Math.cos(a) * layerWidth;
        ctx.beginPath();
        ctx.moveTo(sx + nx, sy + ny);
        ctx.lineTo(ex, ey);
        ctx.lineTo(sx - nx, sy - ny);
        ctx.closePath();
        ctx.fill();
      }
    }

    if (isSelected) {
      ctx.strokeStyle = 'rgba(' + rc + ',' + gc + ',' + bc + ',' + (0.7).toFixed(2) + ')';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(sx, sy, baseR * 8 + Math.sin(time * 4) * 2, 0, Math.PI * 2);
      ctx.stroke();
    }

    ctx.fillStyle = 'rgba(' + rc + ',' + gc + ',' + bc + ',' + (0.16 * k).toFixed(2) + ')';
    ctx.beginPath();
    ctx.arc(sx, sy, baseR * 5.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = 'rgba(' + rc + ',' + gc + ',' + bc + ',' + (0.4 * k).toFixed(2) + ')';
    ctx.beginPath();
    ctx.arc(sx, sy, baseR * 2.4, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = 'rgba(' + rc + ',' + gc + ',' + bc + ',1)';
    ctx.beginPath();
    ctx.arc(sx, sy, baseR * pulse, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath();
    ctx.arc(sx - baseR * 0.3, sy - baseR * 0.3, baseR * 0.35, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

function loop(t) {
  draw(t);
  requestAnimationFrame(loop);
}

/* ============ 手势 ============ */
const pointers = new Map();
let pinchState = null;
let dragState = null;
let tapCandidate = null;

const TAP_MAX_DIST = 8;
const TAP_MAX_TIME = 350;

function localPoint(e) {
  const rect = canvas.getBoundingClientRect();
  return { x: e.clientX - rect.left, y: e.clientY - rect.top };
}

canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  const p = localPoint(e);
  pointers.set(e.pointerId, p);
  view.autoRotate = false;
  inertiaY = 0; inertiaX = 0;
  if (pointers.size === 1) {
    dragState = { x: p.x, y: p.y };
    tapCandidate = { x: p.x, y: p.y, time: performance.now(), moved: 0 };
  } else if (pointers.size === 2) {
    tapCandidate = null;
    const [a, b] = [...pointers.values()];
    pinchState = {
      dist: Math.hypot(b.x - a.x, b.y - a.y),
      center: { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }
    };
  }
});

canvas.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  const p = localPoint(e);
  pointers.set(e.pointerId, p);

  if (pointers.size === 1 && dragState) {
    const dx = p.x - dragState.x;
    const dy = p.y - dragState.y;
    if (tapCandidate) tapCandidate.moved += Math.hypot(dx, dy);
    const rotDelta = dx * 0.011;
    view.rotY += rotDelta;
    view.tiltX = Math.max(0.15, Math.min(1.5, view.tiltX + dy * 0.007));
    inertiaY = rotDelta;
    inertiaX = dy * 0.007 * 0.5;
    dragState = { x: p.x, y: p.y };
  } else if (pointers.size === 2 && pinchState) {
    const [a, b] = [...pointers.values()];
    const dist = Math.hypot(b.x - a.x, b.y - a.y);
    const center = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    if (pinchState.dist > 0 && dist > 0) {
      const factor = dist / pinchState.dist;
      view.zoom = Math.max(0.4, Math.min(6, view.zoom * factor));
    }
    const cdx = center.x - pinchState.center.x;
    const cdy = center.y - pinchState.center.y;
    const rotDelta = cdx * 0.008;
    view.rotY += rotDelta;
    view.tiltX = Math.max(0.15, Math.min(1.5, view.tiltX + cdy * 0.005));
    inertiaY = rotDelta;
    inertiaX = cdy * 0.005 * 0.5;
    pinchState.dist = dist;
    pinchState.center = center;
  }
});

function endPointer(e) {
  if (!pointers.has(e.pointerId)) return;
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinchState = null;
  if (pointers.size === 0) {
    dragState = null;
    if (tapCandidate) {
      const elapsed = performance.now() - tapCandidate.time;
      if (tapCandidate.moved < TAP_MAX_DIST && elapsed < TAP_MAX_TIME) {
        const hit = findMoodStarAt(tapCandidate.x, tapCandidate.y);
        if (hit) {
          selectedRecordId = hit.id;
          showRecordCard(hit);
        } else {
          hideRecordCard();
        }
      }
      tapCandidate = null;
    }
    setTimeout(() => {
      if (pointers.size === 0 && Math.abs(inertiaY) < 0.001 && Math.abs(inertiaX) < 0.001) {
        view.autoRotate = true;
      }
    }, 1800);
  }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);

/* ============ 命中检测 ============ */
const HIT_RADIUS = 28;

function findMoodStarAt(px, py) {
  if (records.length === 0) return null;
  let best = null;
  let bestDist2 = HIT_RADIUS * HIT_RADIUS;
  for (let i = 0; i < records.length; i++) {
    const r = records[i];
    const proj = projectMoodStarNow(r);
    if (!proj) continue;
    const dx = proj.sx - px;
    const dy = proj.sy - py;
    const d2 = dx * dx + dy * dy;
    if (d2 < bestDist2) {
      bestDist2 = d2;
      best = r;
    }
  }
  return best;
}

/* ============ 滚轮 & 按钮 ============ */
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.12 : 1 / 1.12;

}, { passive: false });

document.getElementById('zoomIn').addEventListener('click', () => {

document.getElementById('zoomOut').addEventListener('click', () => {

  addBtn.innerHTML = '<span>+ 新建</span>';
  addBtn.addEventListener('click', openNewMoodModal);
  moodPicker.appendChild(addBtn);

  moodPreview.innerHTML = moodIconHtmlByName(selectedMood.name);
}

/* 心情数据变化后，把全部依赖心情的 UI 刷一遍 */
function refreshAll() {
  // 心情按钮
  document.querySelectorAll('.mood-btn').forEach(btn => {
    if (btn._refresh) btn._refresh();
  });
  // 预览
  moodPreview.innerHTML = moodIconHtmlByName(selectedMood.name);
  // 时光轴
  renderTimeline();
  // 详情卡片（如果开着）
  if (selectedRecordId !== null) {
    const r = records.find(x => x.id === selectedRecordId);
    if (r) showRecordCard(r);
  }
}

const now = new Date();
const pad = n => String(n).padStart(2, '0');
dateInput.value = now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate());

function enterEditMode(record) {
  editingId = record.id;
  noteInput.value = record.note || '';
  noteInput.style.height = 'auto';
  noteInput.style.height = Math.min(noteInput.scrollHeight, 72) + 'px';
  dateInput.value = record.date;
  const target = findMood(record.mood);
  if (target) {
    selectedMood = target;
    moodPreview.innerHTML = moodIconHtmlByName(target.name);
    document.querySelectorAll('.mood-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.mood === target.name);
    });
  }
  saveBtn.textContent = '保存';
  inputBar.classList.add('editing');
  hideRecordCard();
  noteInput.focus();
}

function exitEditMode() {
  editingId = null;
  saveBtn.textContent = '记录';
  inputBar.classList.remove('editing');
  noteInput.value = '';
  noteInput.style.height = '';
}

document.getElementById('rcEdit').addEventListener('click', () => {
  if (selectedRecordId === null) return;
  const r = records.find(x => x.id === selectedRecordId);
  if (!r) return;
  enterEditMode(r);
});

saveBtn.addEventListener('click', () => {
  const date = dateInput.value;
  if (!date) {
    dateInput.classList.remove('warn');
    void dateInput.offsetWidth;
    dateInput.classList.add('warn');
    setTimeout(() => dateInput.classList.remove('warn'), 500);
    return;
  }
  if (editingId !== null) {
    const r = records.find(x => x.id === editingId);
    if (r) {
      r.mood = selectedMood.name;
      r.note = noteInput.value.trim();
      r.date = date;
    }
    exitEditMode();
  } else {
    records.push({
      id: ++idCounter,
      mood: selectedMood.name,
      note: noteInput.value.trim(),
      date
    });
    noteInput.value = '';
    noteInput.style.height = '';
  }
  localStorage.setItem('moodRecords', JSON.stringify(records));
  if (navigator.vibrate) navigator.vibrate([8, 30, 8]);
  updateCount();
  renderTimeline();
});

noteInput.addEventListener('input', () => {
  noteInput.style.height = 'auto';
  noteInput.style.height = Math.min(noteInput.scrollHeight, 72) + 'px';
});

function updateCount() {
  countLabel.textContent = records.length ? records.length + ' 条记录' : '还没有记录';
}

/* ============ 心情操作面板（长按） ============ */
const moodActionModal = document.getElementById('moodActionModal');
const moodActionTitle = document.getElementById('moodActionTitle');
const moodActionPreview = document.getElementById('moodActionPreview');
const moodActionHint = document.getElementById('moodActionHint');
const deleteMoodBtn = document.getElementById('deleteMoodBtn');

let actionTargetMood = null;

function openMoodAction(m) {
  actionTargetMood = m;
  moodActionTitle.textContent = '「' + m.name + '」';
  moodActionPreview.innerHTML = moodIconHtmlByName(m.name);
  moodActionHint.textContent = '';
  moodActionHint.className = 'modal-hint';

  // 内置心情不能删
  if (m.builtin) {
    deleteMoodBtn.style.display = 'none';
  } else {
    const refCount = records.filter(r => r.mood === m.name).length;
    deleteMoodBtn.style.display = '';
    if (refCount > 0) {
      deleteMoodBtn.disabled = true;
      deleteMoodBtn.style.opacity = '0.4';
      moodActionHint.textContent = '该心情下还有 ' + refCount + ' 条记录，先删除那些记录才能删这个心情。';
      moodActionHint.className = 'modal-hint err';
    } else {
      deleteMoodBtn.disabled = false;
      deleteMoodBtn.style.opacity = '';
    }
  }

  moodActionModal.classList.add('show');
}

function closeMoodAction() {
  moodActionModal.classList.remove('show');
  actionTargetMood = null;
}

document.getElementById('cancelMoodActionBtn').addEventListener('click', closeMoodAction);

document.getElementById('resetIconBtn').addEventListener('click', () => {
  if (!actionTargetMood) return;
  actionTargetMood.icon = null;
  saveMoods();
  closeMoodAction();
  refreshAll();
});

deleteMoodBtn.addEventListener('click', () => {
  if (!actionTargetMood) return;
  if (actionTargetMood.builtin) return;
  const refCount = records.filter(r => r.mood === actionTargetMood.name).length;
  if (refCount > 0) return;

  moods = moods.filter(m => m.name !== actionTargetMood.name);
  saveMoods();
  // 如果当前选中的心情被删了，切到第一个
  if (selectedMood.name === actionTargetMood.name) {
    selectedMood = moods[0];
  }
  closeMoodAction();
  renderMoodPicker();
  refreshAll();
  if (navigator.vibrate) navigator.vibrate(30);
});

/* ============ 新建心情 ============ */
const newMoodModal = document.getElementById('newMoodModal');
const newMoodName = document.getElementById('newMoodName');
const newMoodEmoji = document.getElementById('newMoodEmoji');
const newMoodHint = document.getElementById('newMoodHint');
const colorPickerEl = document.getElementById('colorPicker');

let pickedColor = COLOR_CHOICES[0];

function renderColorPicker() {
  colorPickerEl.innerHTML = '';
  COLOR_CHOICES.forEach(c => {
    const sw = document.createElement('div');
    sw.className = 'color-swatch' + (c === pickedColor ? ' selected' : '');
    sw.style.background = c;
    sw.addEventListener('click', () => {
      pickedColor = c;
      renderColorPicker();
    });
    colorPickerEl.appendChild(sw);
  });
}

function openNewMoodModal() {
  newMoodName.value = '';
  newMoodEmoji.value = '';
  pickedColor = COLOR_CHOICES[0];
  renderColorPicker();
  newMoodHint.textContent = '';
  newMoodHint.className = 'modal-hint';
  newMoodModal.classList.add('show');
  setTimeout(() => newMoodName.focus(), 100);
}

function closeNewMoodModal() {
  newMoodModal.classList.remove('show');
}

document.getElementById('cancelNewMoodBtn').addEventListener('click', closeNewMoodModal);

document.getElementById('createMoodBtn').addEventListener('click', () => {
  const name = newMoodName.value.trim();
  if (!name) {
    newMoodHint.textContent = '请填写名字';
    newMoodHint.className = 'modal-hint err';
    return;
  }
  if (name.length > 4) {
    newMoodHint.textContent = '名字最多 4 个字';
    newMoodHint.className = 'modal-hint err';
    return;
  }
  if (findMood(name)) {
    newMoodHint.textContent = '这个名字已经被用了，换一个吧';
    newMoodHint.className = 'modal-hint err';
    return;
  }

  const emoji = newMoodEmoji.value.trim() || '😀';
  moods.push({
    name,
    emoji,
    color: pickedColor,
    icon: null,
    builtin: false
  });
  saveMoods();
  closeNewMoodModal();
  renderMoodPicker();
  refreshAll();
  if (navigator.vibrate) navigator.vibrate(20);
});

/* ============ 相册选图 ============ */
const iconFileInput = document.getElementById('iconFileInput');

document.getElementById('pickImageBtn').addEventListener('click', () => {
  iconFileInput.value = '';
  iconFileInput.click();
});

function compressImage(file, maxSize) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const scale = Math.min(maxSize / img.width, maxSize / img.height, 1);
        canvas.width = Math.max(1, Math.round(img.width * scale));
        canvas.height = Math.max(1, Math.round(img.height * scale));
        const cx = canvas.getContext('2d');
        cx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/png'));
      };
      img.onerror = () => reject(new Error('图片加载失败'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('读取失败'));
    reader.readAsDataURL(file);
  });
}

iconFileInput.addEventListener('change', async () => {
  const file = iconFileInput.files && iconFileInput.files[0];
  if (!file || !actionTargetMood) return;
  try {
    const dataUrl = await compressImage(file, 64);
    actionTargetMood.icon = dataUrl;
    saveMoods();
    closeMoodAction();
    refreshAll();
    if (navigator.vibrate) navigator.vibrate(20);
  } catch (e) {
    moodActionHint.textContent = '图片处理失败';
    moodActionHint.className = 'modal-hint err';
  }
});

/* ============ 时光轴 ============ */
const timelineDrawer = document.getElementById('timelineDrawer');
const timelineList = document.getElementById('timelineList');

document.getElementById('toggleTimeline').addEventListener('click', () => {
  timelineDrawer.classList.add('open');
  renderTimeline();
});
document.getElementById('closeTimeline').addEventListener('click', () => {
  timelineDrawer.classList.remove('open');
});

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function renderTimeline() {
  if (records.length === 0) {
    timelineList.innerHTML = '<div class="empty">还没有记录，写下第一条心情吧 ✨</div>';
    return;
  }
  const sorted = [...records].sort((a, b) => {
    if (a.date !== b.date) return b.date.localeCompare(a.date);
    return b.id - a.id;
  });
  timelineList.innerHTML = sorted.map(r =>
    '<div class="timeline-item" style="border-left-color: ' + moodColorByName(r.mood) + '">' +
      '<button class="delete-btn" data-id="' + r.id + '">✕</button>' +
      '<div class="date">' + r.date + '</div>' +
      '<div class="content">' +
        '<div class="emoji">' + moodIconHtmlByName(r.mood) + '</div>' +
        '<div class="text">' +
          '<div class="mood-name" style="color: ' + moodColorByName(r.mood) + '">' + r.mood + '</div>' +
          (r.note ? '<div>' + escapeHtml(r.note) + '</div>' : '') +
        '</div>' +
      '</div>' +
    '</div>'
  ).join('');

  timelineList.querySelectorAll('.delete-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = Number(btn.dataset.id);
      const r = records.find(x => x.id === id);
      if (!r) return;
      records = records.filter(x => x.id !== id);
      if (selectedRecordId === id) hideRecordCard();
      if (editingId === id) exitEditMode();
      localStorage.setItem('moodRecords', JSON.stringify(records));
      updateCount();
      renderTimeline();
      showUndoToast(r);
    });
  });
}

/* ============ 撤销删除 ============ */
const undoToast = document.getElementById('undoToast');
let pendingDelete = null;

function showUndoToast(record) {
  if (pendingDelete) {
    clearTimeout(pendingDelete.timer);
    pendingDelete = null;
  }
  pendingDelete = {
    record,
    timer: setTimeout(() => {
      pendingDelete = null;
      undoToast.classList.remove('show');
    }, 5000)
  };
  undoToast.classList.add('show');
}

document.getElementById('undoBtn').addEventListener('click', () => {
  if (!pendingDelete) return;
  const r = pendingDelete.record;
  clearTimeout(pendingDelete.timer);
  pendingDelete = null;
  undoToast.classList.remove('show');
  records.push(r);
  records.sort((a, b) => a.id - b.id);
  idCounter = records.reduce((m, x) => Math.max(m, x.id || 0), idCounter);
  localStorage.setItem('moodRecords', JSON.stringify(records));
  updateCount();
  renderTimeline();
});

/* ============ 备份 / 恢复 ============ */
const backupModal = document.getElementById('backupModal');
const backupTitle = document.getElementById('backupTitle');
const exportPanel = document.getElementById('exportPanel');
const importPanel = document.getElementById('importPanel');
const exportText = document.getElementById('exportText');
const importText = document.getElementById('importText');
const importStatus = document.getElementById('importStatus');

function setImportStatus(msg, type) {
  importStatus.textContent = msg || '';
  importStatus.className = 'import-status' + (type ? ' ' + type : '');
}

document.getElementById('openExportBtn').addEventListener('click', () => {
  exportText.value = JSON.stringify({
    version: 2,
    moods: moods,
    records: records
  }, null, 2);
  backupTitle.textContent = '导出记录';
  exportPanel.style.display = '';
  importPanel.style.display = 'none';
  backupModal.classList.add('show');
});

document.getElementById('openImportBtn').addEventListener('click', () => {
  importText.value = '';
  setImportStatus('');
  backupTitle.textContent = '导入记录';
  exportPanel.style.display = 'none';
  importPanel.style.display = '';
  backupModal.classList.add('show');
});

document.getElementById('closeBackup').addEventListener('click', () => {
  backupModal.classList.remove('show');
});

document.getElementById('copyExportBtn').addEventListener('click', async () => {
  const btn = document.getElementById('copyExportBtn');
  try {
    await navigator.clipboard.writeText(exportText.value);
    btn.textContent = '已复制 ✓';
  } catch (e) {
    exportText.select();
    exportText.setSelectionRange(0, exportText.value.length);
    try { document.execCommand('copy'); btn.textContent = '已复制 ✓'; }
    catch (_) { btn.textContent = '请手动复制'; }
  }
  setTimeout(() => { btn.textContent = '复制全部'; }, 1600);
});

document.getElementById('downloadExportBtn').addEventListener('click', () => {
  const btn = document.getElementById('downloadExportBtn');
  try {
    const blob = new Blob([exportText.value], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const d = new Date();
    const stamp = d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate());
    a.href = url;
    a.download = '心情星云-' + stamp + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  } catch (e) {
    btn.textContent = '请改用「复制全部」';
    setTimeout(() => { btn.textContent = '下载文件'; }, 2000);
  }
});

document.getElementById('doImportBtn').addEventListener('click', () => {
  const txt = importText.value.trim();
  if (!txt) { setImportStatus('请先粘贴 JSON', 'err'); return; }

  let parsed;
  try {
    parsed = JSON.parse(txt);
  } catch (e) {
    setImportStatus('JSON 解析失败：' + e.message, 'err');
    return;
  }

  // 兼容两种格式：v2 {moods, records} / 旧版纯记录数组
  let incomingMoods = [];
  let incomingRecords = [];
  if (Array.isArray(parsed)) {
    incomingRecords = parsed;
  } else if (parsed && typeof parsed === 'object') {
    if (Array.isArray(parsed.moods)) incomingMoods = parsed.moods;
    if (Array.isArray(parsed.records)) incomingRecords = parsed.records;
  }

  // 合并心情（按名字）
  let addedMoods = 0;
  for (const m of incomingMoods) {
    if (!m || typeof m.name !== 'string' || !m.name) continue;
    if (findMood(m.name)) continue;  // 同名已存在，跳过
    moods.push({
      name: m.name,
      emoji: m.emoji || '😀',
      color: m.color || '#9AA5B1',
      icon: m.icon || null,
      builtin: false
    });
    addedMoods++;
  }
  if (addedMoods > 0) saveMoods();

  // 合并记录（按 id）
  const validRecords = incomingRecords.filter(r =>
    r && typeof r.id === 'number' &&
    typeof r.mood === 'string' &&
    typeof r.date === 'string'
  );

  const map = new Map();
  for (const r of records) map.set(r.id, r);
  for (const r of validRecords) map.set(r.id, r);
  records = [...map.values()];
  records.sort((a, b) => a.id - b.id);
  idCounter = records.reduce((m, r) => Math.max(m, r.id || 0), idCounter);

  localStorage.setItem('moodRecords', JSON.stringify(records));
  updateCount();
  renderMoodPicker();
  refreshAll();

  let msg = '已导入 ' + validRecords.length + ' 条记录';
  if (addedMoods > 0) msg += '、' + addedMoods + ' 个心情';
  msg += '，当前共 ' + records.length + ' 条 / ' + moods.length + ' 个心情';
  setImportStatus(msg, 'ok');

  setTimeout(() => {
    backupModal.classList.remove('show');
  }, 1400);
});

/* ============ 初始化 ============ */
function init() {
  renderMoodPicker();
  updateCount();
  requestAnimationFrame(() => {
    if (resizeCanvas()) resetView();
    requestAnimationFrame(() => {
      if (resizeCanvas()) resetView();
      lastT = performance.now();
      requestAnimationFrame(loop);
    });
  });
}

let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if (resizeCanvas()) resetView(); }, 150);
});
window.addEventListener('orientationchange', () => {
  setTimeout(() => { if (resizeCanvas()) resetView(); }, 300);
});

init();
</script>
